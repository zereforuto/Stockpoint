appId: com.stockpoint.app
productName: StockPoint
directories:
  output: release
files:
  - out/**
  - package.json
  - node_modules/**
  - '!node_modules/.cache/**'
  - '!node_modules/**/{test,tests,*.md,CHANGELOG.md}'
npmRebuild: false
asar: true
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
